services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  selenium-tests:
    build: .
    container_name: selenium-tests
    depends_on:
      - jenkins
    restart: "no"

volumes:
  jenkins_home:
